devices:
  cisco01:
    enabled: true
    driver: netconf
    access: read_only
    host: 172.23.18.224
    port: 830
    username: apiadmin
    password_env: CISCO_NETDEVOPS_PASSWORD
    timeout: 20
    base_url: https://172.23.18.224
    verify_tls: false

  cisco02:
    enabled: true
    driver: netconf
    access: read_only
    host: 172.23.18.223
    port: 830
    username: apiadmin
    password_env: CISCO_NETDEVOPS_PASSWORD
    timeout: 20
    base_url: https://172.23.18.223
    verify_tls: false

  fortigate01:
    enabled: true
    driver: http
    access: read_only
    host: 172.23.18.225
    base_url: https://172.23.18.225
    verify_tls: false
    token_env: FORTIGATE_NETDEVOPS_TOKEN
    token_style: bearer
    timeout: 20
    monitor_interface: wan1
    probe_path: /api/v2/monitor/system/status
