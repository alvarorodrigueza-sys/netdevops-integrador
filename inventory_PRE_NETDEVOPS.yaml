devices:

  radius1:
    enabled: true
    driver: paramiko
    host: 172.18.15.10
    port: 22
    username: tecsupadm
    password_env: RADIUS1_PASSWORD
    sudo_password_env: RADIUS1_SUDO_PASSWORD
    access: managed

  dhcp1:
    enabled: true
    driver: paramiko
    host: 172.18.15.20
    port: 22
    username: tecsupadm
    password_env: DHCP1_PASSWORD
    sudo_password_env: DHCP1_SUDO_PASSWORD
    access: managed

  r1:
    enabled: false
    driver: netmiko
    device_type: cisco_ios
    host: 192.168.50.10
    username: admin
    password_env: R1_PASSWORD

  sw1:
    enabled: false
    driver: netmiko
    device_type: cisco_ios
    host: 192.168.50.20
    username: admin
    password_env: SW1_PASSWORD